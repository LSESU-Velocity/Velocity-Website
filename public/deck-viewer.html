<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitch Deck</title>
    <link rel="stylesheet" href="/reveal/reveal.css" />
    <link rel="stylesheet" href="/reveal/theme/black.css" />
    <style>
      :root {
        --r-background-color: #0a0a0a;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--r-background-color);
      }
      #error {
        display: none;
        height: 100%;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      #error code {
        display: inline-block;
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
      }
      .reveal {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="error">
      <h1 style="margin: 0 0 12px 0; font-size: 18px">Pitch deck failed to load</h1>
      <p style="margin: 0; opacity: 0.8; line-height: 1.6">
        This viewer expects a deck key in the URL hash, e.g. <code>#velocity:deck:...</code>.
      </p>
    </div>

    <div class="reveal">
      <div class="slides" id="slides"></div>
    </div>

    <script src="/reveal/reveal.js"></script>
    <noscript>
      <div style="position: fixed; inset: 0; padding: 24px; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
        <h1 style="margin: 0 0 12px 0; font-size: 18px">Pitch deck viewer requires JavaScript</h1>
        <p style="margin: 0; opacity: 0.8; line-height: 1.6">Please enable JavaScript and reload.</p>
      </div>
    </noscript>
    <script src="/deck-viewer.js" defer></script>
  </body>
</html>
